<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <!-- Forms is a section of the webpage used to collect user's information -->
    <center>
        <h1>REGISTRATION FORM</h1>
     <form action="">
        <label for="">First name</label><br>
        <input type="text" placeholder="Williams"><br>

        <label for="">Last name</label><br>
        <input type="text" id="Last name" placeholder="Adeosun"><br>

        <label for="">Email Address</label><br>
        <input type="email" id="Email" placeholder="taiwocourage7@gmail.com"><br>

        <label for="">Phone Number</label><br>
        <input type="tel" id="Phone Number" placeholder="+2349113062617"><br>

        <label for="">Password</label><br>
        <input type="password" id="Password" placeholder="********"><br>

        <label for="">D.O.B</label><br>
        <input type="date" id="date of birth"><br>

        <label for="">Gender</label><br>
        <input type="radio" id="Male" value="Male"><br>
        <label for="">Male</label>
        <input type="radio" id="Female" value="Female"><br>
        <label for="">Female</label>

       <p>What's your hobby</p> 

        <label for="">Football</label>
        <input type="checkbox" id="football" name="hobbies" value="football"><br>

        <label for="">Reading</label>
        <input type="checkbox" id="reading" name="hobbies" value="reading"><br>

        <label for="">Chess</label>
        <input type="checkbox" id="chess" name="hobbies" value="chess"><br>

        <label for="">File Upload</label><br>
        <input type="file" id="file upload" name=""><br>

        <label for="">Upload Image</label><br>
        <input type="image" id="image" max="5MB">

     </form><br>
     <button>Submit</button>
     </center>
</body>
</html>
